<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form name="formreg" method="POST" >
        {% csrf_token %}
        <table border="1">
            <tr>
                <td> Name </td>
                <td> <input type="text" name="txt_name" placeholder="Enter Name"  
                    value="{{UserData.userregistration_name}}"></td>
            </tr>
            <tr>
                <td> Email </td>
                <td> <input type="text" name="txt_email" placeholder="Enter Email" 
                    value="{{UserData.userregistration_email}}"></td>
            </tr>
           
            <tr>
                <td> Contact </td>
                <td> <input type="text" name="txt_contact" placeholder="Enter Phno"
                    value="{{UserData.userregistration_contact}}">
                </td>
            </tr>
          
            <tr>
                <td colspan="2">
                    <input type="submit" name="btn_update" value="UPDATE">
                </td>
            </tr>
        </table>
    </form>
    
</body>
</html>
{% if msg %}
    <script>
        alert("{{msg}}");
        window.location='{% url "User:MyProfile" %}';
    </script>
{% endif %}
