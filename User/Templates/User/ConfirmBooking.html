<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm Booking</title>
</head>

<body>

<h2>Confirm Booking</h2>

<form method="POST">
{% csrf_token %}

<table border="1" cellpadding="8">

<tr>
<td>Turf</td>
<td>{{slot.turf.turf_name}}</td>
</tr>

<tr>
<td>Slot Time</td>
<td>
{{ slot.slot_start_time|time:"h:i A" }} -
{{ slot.slot_end_time|time:"h:i A" }}
</td>
</tr>

<tr>
<td>Select Sport</td>
<td>
<select name="sel_sport" required>
<option value="">--Select Sport--</option>
{% for s in sports %}
<option value="{{s.id}}">{{s.sports_name}}</option>
{% endfor %}
</select>
</td>
</tr>

<tr>
<td>Booking Date</td>
<td>{{today}}</td>
</tr>

<tr>
<td>Play Date</td>
<td>
<input type="date" name="txt_date" id="play_date" min="{{today}}" required>
</td>
</tr>

<tr>
<td>Amount</td>
<td>₹{{slot.slot_amount}}</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Confirm Booking">
</td>
</tr>

</table>

</form>

{% if msg %}
<script>
alert("{{msg}}");
</script>
{% endif %}

</body>
</html>

<script>
document.querySelector("form").addEventListener("submit", function(e){

var selectedDate = document.getElementById("play_date").value;
var today = new Date().toISOString().split("T")[0];

if(selectedDate < today){
alert("Play date cannot be in the past");
e.preventDefault();
}

});
</script>
<script>
var slotStartTime = "{{ slot.slot_start_time|time:'H:i' }}";
</script>

<script>
document.querySelector("form").addEventListener("submit", function(e){

var selectedDate = document.getElementById("play_date").value;
var today = new Date().toISOString().split("T")[0];

if(selectedDate < today){
    alert("Play date cannot be in the past");
    e.preventDefault();
    return;
}

if(selectedDate == today){

    var now = new Date();
    var currentTime = now.getHours() + ":" + now.getMinutes();

    var slotTime = slotStartTime;

    if(currentTime > slotTime){
        alert("This slot time has already passed");
        e.preventDefault();
    }
}

});
</script>
