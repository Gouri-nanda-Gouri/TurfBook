{% extends 'Guest/Header.html' %}
{% load static %}
{% block content %}

<style>
    .registration-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px 20px;
        min-height: 80vh;
        background-color: #1a1a1a; /* Matches your dark theme */
    }

    .reg-card {
        background: #222;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        width: 100%;
        max-width: 500px;
        border: 1px solid #333;
    }

    .reg-card h2 {
        color: #fff;
        margin-bottom: 30px;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 24px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        color: #bbb;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .form-group input, 
    .form-group select {
        width: 100%;
        padding: 12px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #2b2b2b;
        color: #fff;
        outline: none;
        transition: border-color 0.3s;
    }

    .form-group input:focus, 
    .form-group select:focus {
        border-color: #ff4d4d; /* Modern accent color */
    }

    .submit-btn {
        width: 100%;
        padding: 15px;
        background: #ff4d4d;
        border: none;
        color: white;
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        border-radius: 4px;
        margin-top: 10px;
        transition: background 0.3s;
    }

    .submit-btn:hover {
        background: #e64444;
    }

    /* Custom styling for file input */
    input[type="file"] {
        padding: 8px;
        font-size: 13px;
    }
</style>

<div class="registration-container">
    <div class="reg-card">
        <h2>User Registration</h2>
        <form name="formreg" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="txt_name" placeholder="Enter Name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="txt_email" placeholder="Enter Email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="txt_password" placeholder="Enter Password" required>
            </div>

            <div class="form-group">
                <label>Contact Number</label>
                <input type="text" name="txt_contact" placeholder="Enter Phno" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" name="txt_dob" required>
            </div>

            <div class="form-group">
                <label>District</label>
                <select name="sel_district" id="sel_district" required>
                    <option value="">--select district--</option>
                    {% for i in disData %}
                    <option value="{{i.id}}">{{i.district_name}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Place</label>
                <select name="sel_place" id="sel_place" required>
                    <option value="">--select place--</option>
                </select>
            </div>

            <div class="form-group">
                <label>Profile Photo</label>
                <input type="file" name="txt_photo" required>
            </div>

            <input type="submit" name="btn_reg" value="Create Account" class="submit-btn">
        </form>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $("#sel_district").change(function () {
        var disid = $(this).val();
        var ur = "{% url 'Guest:Ajaxplace' %}";
        $.ajax({
            url: ur,
            data: { disid: disid },
            success: function (data) {
                $("#sel_place").html(data);
            },
        });
    });
</script>

{% endblock %}
