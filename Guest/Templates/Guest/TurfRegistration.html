<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <form name="formreg" method="POST" enctype="multipart/form-data" >
        {% csrf_token %}
        <table border="1">
            <tr>
                <td> Turf Name </td>
                <td> <input type="text" name="txt_turfname" placeholder="Enter Turf Name"></td>
            </tr>
            <tr>
                <td> Email </td>
                <td> <input type="text" name="txt_email" placeholder="Enter Email"></td>
            </tr>
           
            <tr>
                <td> Contact </td>
                <td> <input type="text" name="txt_contact" placeholder="Enter Phno">
                </td>
            </tr>

            <tr>
                <td> Address </td>
                <td> <input type="text" name="txt_address" placeholder="Enter Address">
                </td>
            </tr>

             <tr>
                <td>District</td>
                <td>

                    <select name="sel_district" id="sel_district">
                        <option value="">--select--</option>
                        {% for i in disData %}
                        <option value="{{i.id}}">
                            {{i.district_name}}</option>
                        {% endfor %}

                    </select>



             <tr>
                <td>Place</td>
                <td>

                    <select name="sel_place" id="sel_place">
                        <option value="">--select--</option>
                    </select>
                </td>
            </tr>
            
            
            <tr>
                <td> Photo </td>
                <td> <input type="file" name="txt_photo" placeholder="Choose Photo">
                </td>
            </tr>
            
             
            <tr>
                <td> Proof </td>
                <td> <input type="file" name="txt_proof" placeholder="Choose Proof">
                </td>
            </tr>


            
            
            <tr>
                <td> Capacity </td>
                
                <td> <input type="text" name="txt_capacity" placeholder="Enter Capacity">
                </td>
            </tr>
            
            <tr>
                <td> Password </td>
                <td> <input type="text" name="txt_password" placeholder="Enter Password">
                </td>
            </tr>

             <tr>
                <td colspan="2">
                    <input type="submit" name="btn_reg" value="SUBMIT">
                </td>
            </tr>

            </select>
            </td>
            </tr>
            </table>
            </form>
            

    
</body>
</html>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $("#sel_district").change(function () {
        var disid = $(this).val();
        var ur = "{% url 'Guest:Ajaxplace' %}";
        $.ajax({
            url: ur,
            data: { disid: disid },
            success: function (data) {
                $("#sel_place").html(data);
            },
        });
    });
</script>
