<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <form name="formreg" method="POST" >
        {% csrf_token %}
        <table border="1">
            <tr>
                <td> Old Password </td>
                <td> <input type="text" name="txt_old" placeholder="Enter Old Password"></td>
            </tr>
            <tr>
                <td> New Password</td>
                <td> <input type="text" name="txt_new" placeholder="Enter New Password"></td>
            </tr>
           
            <tr>
                <td> Retype Password </td>
                <td> <input type="text" name="txt_retype" placeholder="Retype Password">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" name="btn_update" value="UPDATE">
                </td>
            </tr>
    </table>
    </form>
    
</body>
</html>

{% if msg %}
    <script>
        alert("{{msg}}");
        window.location='{% url "TurfOwner:MyProfile" %}';
    </script>
{% endif %}
</body>
</html>
