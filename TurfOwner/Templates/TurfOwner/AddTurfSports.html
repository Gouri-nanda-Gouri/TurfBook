<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turf Sports</title>
</head>
<body>

<h2>Add Sports to Turf</h2>

<form method="POST">
{% csrf_token %}

<table border="1" cellpadding="8">

<tr>
    <td>Select Sport</td>
    <td>
        <select name="sel_sport" required>
            <option value="">--Select Sport--</option>
            {% for i in sports %}
            <option value="{{i.id}}">{{i.sports_name}}</option>
            {% endfor %}
        </select>
    </td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="submit" value="Add Sport">
    </td>
</tr>

</table>

</form>

<br><br>

<h3>Added Sports</h3>

<table border="1" cellpadding="8">

<tr>
    <th>Sl No</th>
    <th>Sport Name</th>
</tr>

{% for i in assigned %}
<tr>
    <td>{{forloop.counter}}</td>
    <td>{{i.sport.sports_name}}</td>
</tr>
{% empty %}
<tr>
    <td colspan="2" align="center">No sports added yet</td>
</tr>
{% endfor %}

</table>

</body>
</html>
{% if msg %}
<script>
alert("{{msg}}");
window.location="{% url 'TurfOwner:AddTurfSports' tid %}"
</script>
{% endif %}
