<!DOCTYPE html>
<html>
<head>
    <title>Add Turf</title>
</head>
<body>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}
<table border="1">

<tr>
    <td>Turf Name</td>
    <td><input type="text" name="txt_name" required></td>
</tr>

<tr>
    <td>Description</td>
    <td><input type="text" name="txt_desc" required></td>
</tr>

<tr>
    <td>District</td>
    <td>
        <select name="sel_district" id="sel_district" required>
            <option value="">--select--</option>
            {% for i in disData %}
            <option value="{{i.id}}">{{i.district_name}}</option>
            {% endfor %}
        </select>
    </td>
</tr>

<tr>
    <td>Place</td>
    <td>
        <select name="sel_place" id="sel_place" required>
            <option value="">--select--</option>
        </select>
    </td>
</tr>

<tr>
    <td>Capacity</td>
    <td><input type="number" name="txt_capacity" required></td>
</tr>



<tr>
    <td>Contact Number</td>
    <td><input type="text" name="txt_contact" required></td>
</tr>

<tr>
    <td>Turf Image</td>
    <td><input type="file" name="txt_photo" required></td>
</tr>

<tr>
    <td colspan="2">
        <input type="submit" value="ADD TURF">
    </td>
</tr>

</table>
</form>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $("#sel_district").change(function () {
        var disid = $(this).val();
        var ur = "{% url 'Guest:Ajaxplace' %}";
        $.ajax({
            url: ur,
            data: { disid: disid },
            success: function (data) {
                $("#sel_place").html(data);
            },
        });
    });
</script>

{% if msg %}
<script>
alert("{{msg}}");
window.location="{% url 'TurfOwner:AddTurf' %}";
</script>
{% endif %}

</body>
</html>
