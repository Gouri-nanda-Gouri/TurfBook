<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Gallery</title>
</head>
<body>

<h2>Add Turf Gallery</h2>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<table border="1" cellpadding="8">

<tr>
    <td>Select Image</td>
    <td>
        <input type="file" name="txt_photo" required>
    </td>
</tr>

<tr>
    <td colspan="2" align="center">
        <input type="submit" value="Upload">
    </td>
</tr>

</table>

</form>

<br><br>

<h3>Gallery Images</h3>

<table border="1" cellpadding="8">

<tr>
    <th>Sl No</th>
    <th>Image</th>
</tr>

{% for i in gallery %}
<tr>
    <td>{{forloop.counter}}</td>
    <td>
        <img src="{{i.gallery_image.url}}" width="120">
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="2" align="center">No images uploaded yet</td>
</tr>
{% endfor %}

</table>

</body>
</html>
{% if msg %}
<script>
alert("{{msg}}");
window.location="{% url 'TurfOwner:AddGallery' tid %}"
</script>
{% endif %}
